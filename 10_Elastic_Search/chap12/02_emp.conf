# TODO: 2) 가공: 데이터 수집된것을 변형 또는 변경(생략)
filter {
    # 불필요한 필드 제거: @version, @timestamp 자동 생성
    # 사용법: remove_field => ["필드", "필드2",...]
    mutate {
        remove_field => ["@version", "@timestamp"]
    }
}

